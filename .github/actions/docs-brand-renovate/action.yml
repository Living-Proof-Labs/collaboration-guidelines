# SPDX-License-Identifier: Apache-2.0
name: Docs brand Renovate runner
description: Propose brand-only updates from trusted default-branch scheduled runs
inputs:
  app-client-id:
    description: Client ID of the owner-approved updater GitHub App
    required: true
  app-private-key:
    description: Private key of the owner-approved updater GitHub App
    required: true
runs:
  using: composite
  steps:
    - name: Reject untrusted invocation before minting a token
      shell: bash
      env:
        CALLER_EVENT: ${{ github.event_name }}
        CALLER_REF: ${{ github.ref }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        CALLER_REPOSITORY: ${{ github.repository }}
      run: |
        [[ $CALLER_EVENT == schedule || $CALLER_EVENT == workflow_dispatch ]]
        [[ -n $DEFAULT_BRANCH && $CALLER_REF == "refs/heads/$DEFAULT_BRANCH" ]]
        [[ $CALLER_REPOSITORY =~ ^Living-Proof-Labs/[A-Za-z0-9_.-]+$ ]]
    - name: Mint token for this repository only
      id: token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.app-client-id }}
        private-key: ${{ inputs.app-private-key }}
        # Omitting owner/repositories scopes the token to the caller repository.
        permission-contents: write
        permission-pull-requests: write
        permission-checks: read
        permission-statuses: read
    - name: Propose a complete docs brand lock update
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        RENOVATE_TOKEN: ${{ steps.token.outputs.token }}
        DOCS_BRAND_REPOSITORY: ${{ github.repository }}
      run: bash "$ACTION_PATH/../../../tools/docs-brand/run.sh"
