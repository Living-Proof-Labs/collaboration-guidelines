# SPDX-License-Identifier: Apache-2.0
name: Verify guidelines and release policy
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm ci --prefix .github/actions/semantic-release --ignore-scripts
      - run: npm test --prefix .github/actions/semantic-release
      - run: .github/actions/semantic-release/node_modules/.bin/markdownlint '*.md' 'docs/*.md'
