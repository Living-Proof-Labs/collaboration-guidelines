# SPDX-License-Identifier: Apache-2.0
name: Verify guidelines and release policy
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    # Runs on the host until the tooling image is published; tracked in
    # https://github.com/Living-Proof-Labs/collaboration-guidelines/issues/47
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.3'
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: '3.54.0'
      - run: task setup
      - run: task verify
      - name: Verify the proposed docs brand lock
        uses: ./.github/actions/docs-brand-check
  shared-host:
    uses: ./.github/workflows/host.yml
    permissions:
      contents: read
      checks: write
  generated-documentation:
    uses: ./.github/workflows/generated-docs.yml
    permissions:
      contents: read
  tooling-image:
    uses: ./.github/workflows/tooling-image.yml
    permissions:
      contents: read
  release-candidate:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    permissions:
      contents: read
    uses: ./.github/workflows/semantic-release-candidate.yml
  release-candidate-contract:
    if: always() && github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: release-candidate
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Verify the candidate contract for this PR head
        shell: bash
        env:
          RESULT: ${{ needs.release-candidate.result }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          CANDIDATE_COMMIT: ${{ needs.release-candidate.outputs.commit }}
          CANDIDATE_VERSION: ${{ needs.release-candidate.outputs.version }}
          CANDIDATE_TAG: ${{ needs.release-candidate.outputs.git-tag }}
          SEMVER_VERSION: ${{ needs.release-candidate.outputs.semver-version }}
          PEP440_VERSION: ${{ needs.release-candidate.outputs.pep440-version }}
          DEBIAN_VERSION: ${{ needs.release-candidate.outputs.debian-version }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CALLER_RUN_NUMBER: ${{ github.run_number }}
          CALLER_RUN_ID: ${{ github.run_id }}
          CALLER_RUN_ATTEMPT: ${{ github.run_attempt }}
          PLAN_RUN_ID: ${{ needs.release-candidate.outputs.run-id }}
          PLAN_RUN_ATTEMPT: ${{ needs.release-candidate.outputs.run-attempt }}
        run: |
          if [[ "$RESULT" != success || ! "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ || "$CANDIDATE_COMMIT" != "$EXPECTED_HEAD" ]]; then
            echo 'Candidate did not successfully evaluate the exact PR head.' >&2
            exit 1
          fi
          core='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          suffix="-pr.${PR_NUMBER}.${CALLER_RUN_NUMBER}.${CALLER_RUN_ATTEMPT}"
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]{0,19}$ || ! "$CALLER_RUN_NUMBER" =~ ^[1-9][0-9]{0,19}$ ||
                ! "$CALLER_RUN_ID" =~ ^[1-9][0-9]{0,19}$ || ! "$CALLER_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,19}$ ||
                ! "$SEMVER_VERSION" =~ ^${core}-pr\.[1-9][0-9]*\.[1-9][0-9]*\.[1-9][0-9]*$ ||
                "$SEMVER_VERSION" != *"$suffix" || "$PLAN_RUN_ID" != "$CALLER_RUN_ID" ||
                "$PLAN_RUN_ATTEMPT" != "$CALLER_RUN_ATTEMPT" ]]; then
            echo 'PR build version does not identify this caller run.' >&2
            exit 1
          fi
          base="${SEMVER_VERSION%"$suffix"}"
          printf -v padded_id '%20s' "$CALLER_RUN_ID"
          printf -v padded_attempt '%20s' "$CALLER_RUN_ATTEMPT"
          if [[ "$PEP440_VERSION" != "$base.dev${CALLER_RUN_NUMBER}${padded_id// /0}${padded_attempt// /0}" ||
                "$DEBIAN_VERSION" != "$base~${suffix#-}" ]]; then
            echo 'Package versions disagree with the PR build identity.' >&2
            exit 1
          fi
          if [[ -z "$CANDIDATE_VERSION" && -z "$CANDIDATE_TAG" ]]; then
            printf 'No release due for %s; build version %s\n' "$CANDIDATE_COMMIT" "$SEMVER_VERSION"
            exit 0
          fi
          if [[ ! "$CANDIDATE_VERSION" =~ ^${core}$ || "$CANDIDATE_TAG" != "v$CANDIDATE_VERSION" ||
                "$SEMVER_VERSION" != "${CANDIDATE_VERSION}${suffix}" ]]; then
            echo 'Candidate version and tag do not form a stable release pair.' >&2
            exit 1
          fi
          printf 'Release candidate %s (%s) for %s; build version %s; read-only\n' \
            "$CANDIDATE_VERSION" "$CANDIDATE_TAG" "$CANDIDATE_COMMIT" "$SEMVER_VERSION"
