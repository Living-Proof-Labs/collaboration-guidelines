# SPDX-License-Identifier: Apache-2.0
name: Guidelines release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/verify.yml
  version:
    if: github.event_name == 'push'
    permissions:
      contents: read
    uses: ./.github/workflows/semantic-release-candidate.yml
  manual:
    needs: version
    if: github.event_name == 'push'
    permissions:
      contents: read
    uses: ./.github/workflows/manual-build.yml
    with:
      version: ${{ needs.version.outputs.semver-version }}
      commit: ${{ needs.version.outputs.commit }}
      run: ${{ needs.version.outputs.run-id }}
      attempt: ${{ needs.version.outputs.run-attempt }}
  release:
    needs: [verify, version, manual]
    # Keep the existing no-input dispatch for tooling release recovery.
    # Normal pushes require the exact preverified manual. Dispatch never deploys it.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      vars.RELEASES_ENABLED != 'false' && needs.verify.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' &&
        needs.version.result == 'skipped' && needs.manual.result == 'skipped') ||
       (github.event_name == 'push' &&
        needs.version.result == 'success' && needs.manual.result == 'success' &&
        needs.version.outputs.version != '' &&
        needs.version.outputs.version == needs.version.outputs.semver-version &&
        needs.version.outputs.git-tag == format('v{0}', needs.version.outputs.version) &&
        needs.version.outputs.commit == github.sha &&
        needs.version.outputs.run-id == github.run_id &&
        needs.version.outputs.run-attempt == github.run_attempt &&
        needs.manual.outputs.artifact-id != '' && needs.manual.outputs.digest != ''))
    permissions:
      contents: write
    uses: ./.github/workflows/semantic-release.yml
    with:
      draft-release: true
      expected-version: ${{ needs.version.outputs.version || '' }}
      expected-commit: ${{ needs.version.outputs.commit || '' }}
  publish-tooling:
    needs: [verify, release]
    if: needs.release.outputs.draft-created == 'true'
    runs-on: ubuntu-24.04
    # Existing Actions token only; no App key or persistent credential.
    permissions:
      contents: write
      packages: write
    concurrency:
      group: publish-guidelines-tooling
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: tooling-${{ github.sha }}-*
          merge-multiple: true
          path: tooling-candidate
      - name: Publish tested images, attach evidence, and finalize release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.git-tag }}
        run: bash tools/tooling/publish.sh
  deploy-manual:
    needs: [release, publish-tooling, version, manual]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.release.outputs.draft-created == 'true' &&
      needs.publish-tooling.result == 'success' &&
      needs.release.outputs.git-tag == needs.version.outputs.git-tag &&
      needs.release.outputs.version == needs.version.outputs.version &&
      needs.release.outputs.commit == needs.version.outputs.commit
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-manual.yml
    with:
      release_tag: ${{ needs.release.outputs.git-tag }}
      version: ${{ needs.release.outputs.version }}
      commit: ${{ needs.release.outputs.commit }}
      run: ${{ needs.version.outputs.run-id }}
      attempt: ${{ needs.version.outputs.run-attempt }}
      artifact_id: ${{ needs.manual.outputs.artifact-id }}
      digest: ${{ needs.manual.outputs.digest }}
