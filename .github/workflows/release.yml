name: Guidelines release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/verify.yml
  release:
    needs: verify
    # Keep the existing no-input dispatch for tooling release recovery.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      vars.RELEASES_ENABLED != 'false' && needs.verify.result == 'success'
    permissions:
      contents: write
    uses: ./.github/workflows/semantic-release.yml
    with:
      draft-release: true
  manual:
    needs: release
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.release.outputs.draft-created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/manual-build.yml
    with:
      version: ${{ needs.release.outputs.version }}
      commit: ${{ needs.release.outputs.commit }}
      run: ${{ github.run_id }}
      attempt: ${{ github.run_attempt }}
  publish-tooling:
    needs: [verify, release]
    if: needs.release.outputs.draft-created == 'true'
    runs-on: ubuntu-24.04
    # Existing Actions token only; no App key or persistent credential.
    permissions:
      contents: write
      packages: write
    concurrency:
      group: publish-guidelines-tooling
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: tooling-${{ github.sha }}-*
          merge-multiple: true
          path: tooling-candidate
      - name: Publish tested images, attach evidence, and finalize release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.git-tag }}
        run: bash tools/tooling/publish.sh
  deploy-manual:
    needs: [release, publish-tooling, manual]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.release.outputs.draft-created == 'true' &&
      needs.publish-tooling.result == 'success' &&
      needs.manual.result == 'success' &&
      needs.manual.outputs.artifact-id != '' &&
      needs.manual.outputs.digest != ''
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-manual.yml
    with:
      release_tag: ${{ needs.release.outputs.git-tag }}
      version: ${{ needs.release.outputs.version }}
      commit: ${{ needs.release.outputs.commit }}
      run: ${{ github.run_id }}
      attempt: ${{ github.run_attempt }}
      artifact_id: ${{ needs.manual.outputs.artifact-id }}
      digest: ${{ needs.manual.outputs.digest }}
