# SPDX-License-Identifier: Apache-2.0
name: Shared semantic release
on:
  workflow_call:
    inputs:
      dry-run:
        type: boolean
        default: false
      draft-release:
        type: boolean
        default: false
    outputs:
      build-version:
        description: Version of the exact verified release tag; empty for dry run or no release.
        value: ${{ jobs.release.outputs.build-version }}
      semver-version:
        description: SemVer artifact version.
        value: ${{ jobs.release.outputs.semver-version }}
      pep440-version:
        description: Python package version following the PEP 440 specification.
        value: ${{ jobs.release.outputs.pep440-version }}
      debian-version:
        description: Debian upstream version; does not include a package revision.
        value: ${{ jobs.release.outputs.debian-version }}
      draft-created:
        description: Whether a draft release was created for asset assembly.
        value: ${{ jobs.release.outputs.draft-created }}
      published:
        description: Whether this invocation published a release.
        value: ${{ jobs.release.outputs.published }}
      version:
        description: Published or dry-run version, or empty for no release.
        value: ${{ jobs.release.outputs.version }}
      git-tag:
        description: Published or dry-run tag, or empty for no release.
        value: ${{ jobs.release.outputs.git-tag }}
      commit:
        description: Exact 40-character source commit evaluated for this release.
        value: ${{ jobs.release.outputs.commit }}
      release-url:
        description: Published release URL, or empty for dry-run or no release.
        value: ${{ jobs.release.outputs.release-url }}
permissions:
  contents: read
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: shared-semantic-release
      cancel-in-progress: false
    outputs:
      build-version: ${{ steps.release.outputs.build-version }}
      semver-version: ${{ steps.release.outputs.semver-version }}
      pep440-version: ${{ steps.release.outputs.pep440-version }}
      debian-version: ${{ steps.release.outputs.debian-version }}
      draft-created: ${{ steps.release.outputs.draft-created }}
      published: ${{ steps.release.outputs.published }}
      version: ${{ steps.release.outputs.version }}
      git-tag: ${{ steps.release.outputs.git-tag }}
      commit: ${{ steps.release.outputs.commit }}
      release-url: ${{ steps.release.outputs.release-url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # GitHub.com: same repository and exact revision as this called workflow.
      - uses: $/.github/actions/semantic-release
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          dry-run: ${{ inputs.dry-run }}
          draft-release: ${{ inputs.draft-release }}
