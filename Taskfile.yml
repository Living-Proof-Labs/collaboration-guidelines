version: '3'

tasks:
  setup:
    desc: Install locked project tooling (Node 24 and npm must be installed)
    cmds:
      - npm ci --prefix .github/actions/semantic-release --ignore-scripts
  check:
    desc: Check documentation
    cmds:
      - npm run check --prefix .github/actions/semantic-release
  test:
    desc: Test release policy, engine, contracts, and docs deploy authentication
    cmds:
      - npm test --prefix .github/actions/semantic-release
      - node --test tests/guidelines-pins.test.mjs tests/docs-brand-lock.test.mjs tests/docs-brand-check.test.mjs tools/docs-brand/test.mjs tests/action-sha-pins.test.mjs tests/guidelines-self-pin-review.test.mjs tests/deploy-freshness-auth.test.mjs tests/gemini-setup.test.mjs tests/tooling-image.test.mjs tests/doc-links-and-depth.test.mjs tests/manual-release-tag.test.mjs tests/apache-only-license.test.mjs
  verify:
    desc: Run checks and tests
    cmds:
      - task: check
      - task: test
  host:build:
    desc: Build the common host in a fresh Ubuntu image
    cmds:
      - bash tools/host/build.sh host
  host:check:
    desc: Verify host tools, daemon, and actual container execution
    cmds:
      - bash environments/host/check.sh smoke
  host:test:
    desc: Test an isolated common host against the existing authorized Docker daemon
    cmds:
      - bash tools/host/integration.sh
  container:build:
    desc: Build this repository's tooling container
    cmds:
      - bash tools/host/build.sh tooling
  container:test:
    desc: Run checks and individual tests inside the tooling container
    cmds:
      - bash tools/host/container-test.sh
  host:reporter:
    desc: Validate the pinned reporter's documented development container
    cmds:
      - bash tools/host/reporter.sh
  host:evidence:
    desc: Retain source, execution, and image identities without configuration or secrets
    cmds:
      - bash tools/host/evidence.sh
  docs:build:
    desc: Build the generated documentation template's locked tooling image
    cmds:
      - bash tools/docs/container.sh build
  docs:verify:
    desc: Test and generate the HTML template artifact inside its container
    cmds:
      - bash tools/docs/container.sh verify
  renovate:verify:
    desc: Validate the reusable preset and test extraction inside pinned Renovate
    cmds:
      - bash tools/renovate/run.sh verify
  renovate:extract:
    desc: Run a credential-free, no-write local extraction dry run
    cmds:
      - bash tools/renovate/run.sh extract
  manual:build:
    desc: Build the repository manual tooling image
    cmds:
      - bash tools/manual/container.sh build
  manual:verify:
    desc: Generate and browser-test the repository manual in its tooling container
    cmds:
      - bash tools/manual/container.sh verify
